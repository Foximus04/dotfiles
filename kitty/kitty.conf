# Font Configuration
font_size 	10.0
font_family	JetBrainsMono Nerd Font Mono

# Window Configuration
window_padding_width 4
background_opacity 0.8
# background_blur 32
hide_window_decorations yes
disable_ligatures never

# Cursor Configuration
cursor_shape underline
cursor_blink_interval 0.33
cursor_trail 0

default_pointer_shape arrow

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled
shell_integration no-cursor

touch_scroll_multiplier 1.0
momentum_scroll 0.99

underline_hyperlinks always

confirm_os_window_close 0

# Font + colors — generated by ~/.config/theme/apply.sh.
# Kept last so it overrides the inline settings above.
include theme.conf

map ctrl+n launch --cwd=current --type=os-window

map ctrl+backspace 		send_key alt+backspace
map ctrl+shift+left 	send_key ctrl+shift+left
map ctrl+shift+right	send_key ctrl+shift+right
map ctrl+shift+up			send_key ctrl+shift+up
map ctrl+shift+down		send_key ctrl+shift+down


map ctrl+y send_text all y\n
# map ctrl+µ send_text all µ\n


enable_audio_bell no

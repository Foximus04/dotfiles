config_version = 14

[bar.default]
capsule_radius = 1
concave_edge_corners = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "keyboard_layout",
    "battery",
    "control-center",
    "session"
]
font_family = "JetBrainsMono Nerd Font Mono"
font_weight = 200
margin_ends = 0
position = "bottom"
radius = 0
shadow = false
thickness = 20
widget_spacing = 8

[control_center]
hidden_tabs = [ "media", "monitor", "weather", "calendar", "notifications", "screen-time" ]

[desktop_widgets]
enabled = false

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
border = false
history_retention_hours = 1

[osd]
border = false
position = "bottom_center"
position_vertical = "bottom_center"

    [osd.kinds]
    keyboard_layout = false
    lock_keys = false
    media = false

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 0.0
font_family = "JetBrainsMonoNL NFP Light"
input_borders = false
polkit_agent = true
popup_borders = false
popup_shadows = false

    [shell.animation]
    enabled = false
    speed = 4.0

    [shell.keyboard_layout.custom_labels]
    "English (UK)" = "UK"
    Norwegian = "NO"

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false

    [shell.panel]
    transparency_mode = "glass"

    [shell.screen_corners]
    size = 1

[system.monitor]
enabled = false

[theme]
builtin = "Ayu"

[wallpaper.default]
path = "/home/fox/Pictures/rainworld/473160-steam-workshoprain-world-wallpaper.png"

[wallpaper.last]
path = "/home/fox/Pictures/rainworld/473160-steam-workshoprain-world-wallpaper.png"

[wallpaper.monitors.eDP-1]
path = "/home/fox/Pictures/rainworld/473160-steam-workshoprain-world-wallpaper.png"

[weather]
enabled = false

[widget.brightness]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
format = "{:%H:%M:%S | %d/%m/%y}"
tooltip_format = "{:%A}, Week {:%V}"

[widget.control-center]
enabled = false

[widget.keyboard_layout]
glyph = ""
show_glyph = false

[widget.launcher]
enabled = false

[widget.notifications]
enabled = false

[widget.session]
enabled = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
show_all_outputs = true
style = "minimal"
# ~/.config/hypr/hyprlock.conf
# Palette ($font, $background, $foreground, $accent) comes from the generated
# theme file below -- edit ~/.config/theme/theme.json + run apply.sh, not here.
source = ~/.config/hypr/hypr-theme.conf
# $wallpaper = the currently-showing wallpaper, written by ~/.config/theme/wallpaper.sh
source = ~/.config/hypr/hypr-wallpaper.conf

general {
    hide_cursor        = true
    # grace              = 2      # seconds you can wake without typing a password
    ignore_empty_input = true
    fail_timeout       = 1000
    immediate_render   = true
}

animations {
    enabled = false
}

background {
    monitor     =
    color       = $background
    path        = $wallpaper
    blur_passes = 4
    blur_size   = 10
}

# Good morning
label {
    monitor     =
    text        = Good morning
    color       = $foreground
    font_size   = 72
    font_family = $font
    position    = 0, 150px
    halign      = center
    valign      = center
}

# Time
label {
    monitor     =
    text        = cmd[update:1000] echo "$(date +'%H:%M')"
    color       = $foreground
    font_size   = 56
    font_family = $font
    position    = 0, 0
    halign      = center
    valign      = center
}

# Password
input-field {
    monitor           =
    size              = 280, 52
    outline_thickness = 2
    rounding          = 0
    dots_center       = true
    outer_color       = $accent
    inner_color       = $background
    font_color        = $foreground
    check_color       = rgba(204, 136, 34, 1.0)
    fade_on_empty     = false
    placeholder_text  = <i>password</i>
    check_text        = uhh...
    fail_text         = fuck off
    position          = 0, -125
    halign            = center
    valign            = center
}

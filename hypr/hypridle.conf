# ~/.config/hypr/hypridle.conf
# Idle management. Autostarted from hyprland.lua (`hl.exec_cmd("hypridle")`).

general {
    lock_cmd         = pidof hyprlock || hyprlock     # don't spawn multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session          # lock before the system suspends
    after_sleep_cmd  = hyprctl dispatch dpms on       # turn the display back on after wake
    ignore_dbus_inhibit = false                       # respect apps (mpv, etc.) that inhibit idle
}

# 5 min — dim the screen (saved + restored so it returns to your level)
listener {
    timeout   = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 10 min — lock
listener {
    timeout   = 600
    on-timeout = loginctl lock-session
}

# 10.5 min — turn the display off
listener {
    timeout   = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 15 min — suspend
listener {
    timeout   = 900
    on-timeout = systemctl suspend
}

# Lenovo Yoga Pro 7 14IRH8 - SOF sof-hda-dsp / Realtek ALC287 internal speakers.
#
# Problem: the main speakers and the bass speaker are driven by TWO independent
# codec DACs. PipeWire's volume slider maps onto the "Speaker" control, which is
# only the MAIN DAC's gain - the bass DAC's gain is separate and the bass PIN
# (node 0x17) is mute-only, so the bass amp plays the full-scale signal at every
# volume. Result: bass is binary (off or blasting) and never tracks the slider.
#
# Fix: tell PipeWire to ignore this card's hardware mixer and apply volume in
# SOFTWARE instead. Software volume is applied in the PipeWire graph, upstream of
# the single analog PCM (card "sofhdadsp", device 0) that feeds the SOF DSP and
# both DACs - so the attenuation reaches the mains AND the bass, and both scale
# together with the slider.
#
# Must be set on the DEVICE (matched by the stable PCI device.name, immune to
# ALSA card-index renumbering across reboots) - setting it on the sink node does
# not disable the hardware mixer. Scoped to this card only; the DualSense keeps
# its normal hardware volume.
#
# Ref: WirePlumber ALSA config docs - api.alsa.soft-mixer "will disable the
# hardware mixer for volume control and mute ... leaving the hardware mixer
# untouched" (still used to mute unused paths).

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.pci-0000_00_1f.3-platform-skl_hda_dsp_generic"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
